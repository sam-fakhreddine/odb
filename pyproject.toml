[build-system]
requires = ["setuptools>=77,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "aws-emulator-shim"
version = "0.2.0"
description = "ODB (Ol' Dirty Bridge): local AWS Emulator account routing and explicit bridges"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["boto3>=1.40.66,<2"]
keywords = ["aws", "emulator", "multi-account", "testing"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://github.com/sam-fakhreddine/odb"
Repository = "https://github.com/sam-fakhreddine/odb"
Issues = "https://github.com/sam-fakhreddine/odb/issues"
Changelog = "https://github.com/sam-fakhreddine/odb/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["build>=1.2,<2", "twine>=6,<8", "ruff>=0.14,<1"]

[project.scripts]
odb = "aws_emulator_shim.__main__:main"
aws-emulator-shim = "aws_emulator_shim.__main__:main"

[tool.setuptools.packages.find]
include = ["aws_emulator_shim*"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
