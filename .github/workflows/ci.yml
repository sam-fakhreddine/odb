name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  unit:
    name: Unit tests (${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e '.[dev]'
      - run: python scripts/groom_check.py
      - run: python -m ruff check .
      - run: python -m unittest discover -s tests/unit -v
      - run: python scripts/check_types.py
      - run: python -m aws_emulator_shim.schema --check docs/schemas/manifest-v1.schema.json

  package:
    name: Build distributions
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install '.[dev]'
      - name: Check release version
        run: |
          python - <<'PY'
          import os
          import re
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          if not re.fullmatch(r"(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)", version):
              raise SystemExit("Package version must be MAJOR.MINOR.PATCH")
          if os.environ["GITHUB_REF_TYPE"] == "tag":
              if os.environ["GITHUB_REF_NAME"] != f"v{version}":
                  raise SystemExit("Git tag must match the package version")
          PY
      - name: Require release commit on main
        if: startsWith(github.ref, 'refs/tags/')
        run: git merge-base --is-ancestor HEAD origin/main
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Install and smoke-test wheel outside checkout
        run: |
          python -m venv "$RUNNER_TEMP/odb-wheel"
          for wheel in dist/*.whl; do
            "$RUNNER_TEMP/odb-wheel/bin/python" -m pip install "${wheel}[dev]"
          done
          source_root="$PWD"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/odb-wheel/bin/odb" --help
          "$RUNNER_TEMP/odb-wheel/bin/aws-emulator-shim" --help
          "$RUNNER_TEMP/odb-wheel/bin/python" -c \
            'from aws_emulator_shim import Emulator, Harness, Manifest, parse_manifest'
          "$RUNNER_TEMP/odb-wheel/bin/python" \
            "$source_root/scripts/check_types.py" --installed
          "$RUNNER_TEMP/odb-wheel/bin/python" -m aws_emulator_shim.schema \
            --check "$source_root/docs/schemas/manifest-v1.schema.json"
      - name: Generate checksums
        run: |
          cd dist
          sha256sum *.whl *.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Draft GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: distributions
          path: release-assets
      - name: Create draft with checked distributions
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd release-assets
          sha256sum --check SHA256SUMS
          gh release create "$RELEASE_TAG" --verify-tag --draft \
            --title "ODB $RELEASE_TAG" --generate-notes \
            ./*.whl ./*.tar.gz ./SHA256SUMS
