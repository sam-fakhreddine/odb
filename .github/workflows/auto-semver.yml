name: Propose semantic version

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: auto-semver
  cancel-in-progress: false

jobs:
  propose:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || vars.ODB_AUTO_SEMVER == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Require CI-triggering token
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          if [ -z "$RELEASE_TOKEN" ]; then
            echo "::error::Configure RELEASE_PLEASE_TOKEN before enabling release proposals."
            exit 1
          fi
      - name: Propose version and changelog
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true
